[project]
name = "foxhire-mcp-server"
version = "0.1.0"
description = "MCP server for the FoxHire.AI job search pipeline"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"
